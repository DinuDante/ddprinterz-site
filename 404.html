<script>
const b=document.querySelector('.menu'),l=document.querySelector('.links'),toggle=document.querySelector('.theme-toggle'),themeLabel=document.querySelector('.theme-label'),metaTheme=document.querySelector('meta[name="theme-color"]');
b.onclick=()=>{const o=l.classList.toggle('open');b.setAttribute('aria-expanded',o)};
l.onclick=()=>{l.classList.remove('open');b.setAttribute('aria-expanded','false')};
function syncTheme(){const day=document.documentElement.dataset.theme==='day';if(toggle){toggle.setAttribute('aria-pressed',String(day));toggle.setAttribute('aria-label',day?'Switch to dark mode':'Switch to light mode');toggle.title=day?'Dark mode':'Light mode';}if(themeLabel)themeLabel.textContent=day?'light':'dark';if(metaTheme)metaTheme.content=day?'#e5e3d8':'#0d1512'}
if(toggle) {
  toggle.onclick=()=>{const next=document.documentElement.dataset.theme==='night'?'day':'night';document.documentElement.dataset.theme=next;localStorage.setItem('ddprinterz-theme',next);syncTheme()};
}
}
syncTheme();

// Lightbox logic
const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img'), lbCap = document.getElementById('lb-caption'), lbEnq = document.getElementById('lb-enquire');
document.querySelectorAll('a.tile').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    lbImg.src = el.href;
    const title = el.querySelector('b').textContent;
    lbCap.textContent = title;
    lbEnq.href = 'https://wa.me/919556703560?text=' + encodeURIComponent('Hi DinuDante! I am interested in something like: ' + title);
    lb.showModal();
    document.body.style.overflow = 'hidden';
  });
});
if(lb) {
  lb.querySelector('.lb-close').onclick = () => { lb.close(); document.body.style.overflow = ''; };
  lb.addEventListener('click', e => { if(e.target === lb) { lb.close(); document.body.style.overflow = ''; } });
  lb.addEventListener('close', () => { document.body.style.overflow = ''; });
}
</script>
