<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1311">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<script>(function(){try{var t=localStorage.getItem('ddprinterz-theme');if(t!=='day'&&t!=='night')t=null;document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: light)').matches?'day':'night')}catch(e){}})()</script>
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/brand/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="/assets/brand/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/logo-180.png">
<meta property="og:site_name" content="DDPrinterZ">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="DDPrinterZ — custom 3D printing in Bhubaneswar">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/style.css?v={{assetVersion}}">
{{head}}
</head>
<body>
{{icons}}
<a class="skip" href="#main">Skip to content</a>

<header class="site-nav">
  <div class="wrap site-nav__inner">
    <a class="brand" href="/" aria-label="DDPrinterZ — home">
      <img src="/assets/brand/logo-40.png" srcset="/assets/brand/logo-40.png 1x, /assets/brand/logo-80.png 2x, /assets/brand/logo-120.png 3x" width="40" height="40" alt="">
      <span>DD<i>PrinterZ</i></span>
    </a>
    <div class="nav-right">
      <nav class="nav-links" id="nav-links" aria-label="Main">
        {{nav}}
      </nav>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light theme">
        <svg class="icon icon--moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="icon icon--sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav-links">
        <svg class="icon" aria-hidden="true" width="16" height="16"><use href="#i-menu"/></svg>Menu
      </button>
    </div>
  </div>
</header>

<main id="main">
{{content}}
</main>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div>
      <p>© 2026 DDPrinterZ · Custom 3D printing · Bhubaneswar, Odisha</p>
      <p style="margin-top:8px">Made by DinuDante.</p>
    </div>
    <nav aria-label="Social and profiles">
      <a href="{{instagram}}" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-instagram"/></svg>Instagram</a>
      <a href="{{youtube}}" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-youtube"/></svg>YouTube</a>
      <a href="mailto:{{email}}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Email</a>
      <a href="{{portfolio}}" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>DinuDante portfolio</a>
    </nav>
    <nav aria-label="Policies">
      <a href="/privacy.html">Privacy</a>
      <a href="/order-policy.html">Order policy</a>
    </nav>
  </div>
</footer>

<aside aria-label="Quick contact">
  <a class="float-wa" href="{{whatsappFloat}}" target="_blank" rel="noopener noreferrer" aria-label="Message DDPrinterZ on WhatsApp">
    <img src="/assets/brand/whatsapp.webp" width="34" height="34" alt="">
  </a>
</aside>

{{dialog}}
<script>{{script}}</script>
</body>
</html>
